[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "github-triage-agent"
version = "0.1.0"
description = "Autonomous GitHub issue/PR triage agent — LangGraph orchestration exposed via an MCP server"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "tenacity>=8.3",
    "structlog>=24.1",
    "anthropic>=0.40",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0",
    "mcp>=1.2",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
triage-agent = "triage_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/triage_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
mypy_path = "src"
packages = ["triage_agent"]
